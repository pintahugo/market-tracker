name: Päivittäinen Pörssikatsaus (Push-ilmoitus)

on:
  schedule:
    # Ma-Pe klo 07:00 UTC = klo 09:00 Suomen talviaikaa (EET = UTC+2) — Helsingin pörssin avaus
    - cron: '0 7 * * 1-5'
    # Ma-Pe klo 15:30 UTC = klo 17:30 Suomen talviaikaa (EET = UTC+2) — Helsingin pörssin sulkeutuminen
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Mahdollistaa ajon manuaalisesti yhdellä klikkauksella GitHubista

jobs:
  market-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Hae koodivarasto
        uses: actions/checkout@v4

      - name: Asenna uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Aja pörssikatsaus ja lähetä ilmoitus puhelimeen
        run: |
          uv run tracker.py --notify --export
